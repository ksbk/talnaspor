<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talnaspor</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1a1d23;
    --muted: #5d6573;
    --border: #dde1e7;
    --accent: #0b5cad;
    --accent-text: #ffffff;
    --user: #e7f0fa;
    --info-bg: #eef4fb;
    --info-border: #b8d0ea;
    --warn-bg: #fdf6e7;
    --warn-border: #e8cf94;
    --error-bg: #fbeeee;
    --error-border: #e5b3b3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --surface: #1d2128;
      --text: #e8eaee;
      --muted: #9aa3b2;
      --border: #333a45;
      --accent: #5ea4ec;
      --accent-text: #0b1220;
      --user: #1f3047;
      --info-bg: #1b2736;
      --info-border: #2f4d70;
      --warn-bg: #2e2717;
      --warn-border: #6b5526;
      --error-bg: #301c1d;
      --error-border: #6e3436;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  header h1 { margin: 0; font-size: 1.75rem; }
  .languages { display: flex; gap: 4px; flex-shrink: 0; }
  .languages button {
    padding: 4px 10px;
    font-size: 0.875rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .languages button[aria-pressed="true"] {
    color: var(--accent-text);
    background: var(--accent);
    border-color: var(--accent);
  }
  header p { margin: 4px 0 0; color: var(--muted); }
  form {
    display: flex;
    gap: 8px;
    margin: 20px 0 12px;
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
  }
  form button {
    padding: 12px 18px;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    font-weight: 600;
  }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .examples button {
    padding: 6px 12px;
    font-size: 0.875rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  #log { display: flex; flex-direction: column; gap: 16px; }
  .exchange { display: flex; flex-direction: column; gap: 8px; }
  .question {
    align-self: flex-end;
    max-width: 85%;
    padding: 8px 14px;
    background: var(--user);
    border-radius: 14px 14px 4px 14px;
  }
  .reply {
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .reply.clarification, .reply.suggestions {
    background: var(--info-bg);
    border-color: var(--info-border);
  }
  .tables { margin: 0 0 10px; padding-left: 20px; }
  .tables li { margin-bottom: 8px; }
  .tables a { color: var(--accent); font-weight: 600; }
  .reply.refusal { background: var(--warn-bg); border-color: var(--warn-border); }
  .reply.error { background: var(--error-bg); border-color: var(--error-border); }
  .reply.loading { color: var(--muted); }
  .figure { font-size: 2rem; font-weight: 700; line-height: 1.2; }
  .labels { color: var(--muted); margin: 2px 0 10px; }
  .points { border-collapse: collapse; margin: 0 0 10px; }
  .points td { padding: 2px 16px 2px 0; }
  .points td:last-child { font-weight: 600; text-align: right; }
  .sentence { margin: 0 0 10px; }
  .meta { font-size: 0.875rem; color: var(--muted); }
  .notice {
    margin: 10px 0 4px;
    padding: 6px 10px;
    font-size: 0.875rem;
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 6px;
  }
  .meta a { color: var(--accent); }
  details { margin-top: 10px; font-size: 0.875rem; }
  summary { cursor: pointer; color: var(--muted); }
  pre {
    margin: 8px 0 0;
    padding: 10px;
    overflow-x: auto;
    background: var(--bg);
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Talnaspor</h1>
      <p id="subtitle"></p>
    </div>
    <div class="languages" role="group" aria-label="Tungumál / Language">
      <button type="button" data-lang="is">ÍS</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <form id="ask">
    <label id="question-label" for="question" hidden></label>
    <input id="question" type="text" maxlength="500" autocomplete="off" required>
    <button id="send" type="submit"></button>
  </form>

  <div class="examples" id="examples"></div>

  <section id="log" aria-live="polite"></section>
</main>

<script>
  const TEXT = {
    is: {
      subtitle: "Spurðu um hagtölur á íslensku eða ensku. Svörin koma beint úr opinberum gögnum Hagstofu Íslands.",
      question: "Spurning",
      placeholder: "t.d. Hver er verðbólgan núna?",
      send: "Spyrja",
      examplesLabel: "Dæmi um spurningar",
      examples: [
        "Hver er verðbólgan núna?",
        "Hvað búa margir á Íslandi?",
        "Hvernig hefur mannfjöldinn breyst?",
        "Verðbólga í september 2025 og 2026",
        "Verðbólga án húsnæðis í mars 2026",
        "Hver var fjölgun íbúa árið 2024?",
        "Hversu margir eru atvinnulausir á Íslandi?",
        "Hver er munurinn á launum karla og kvenna?",
        "Verðbólga árið 2024",
      ],
      openTable: "Opna töflu hjá Hagstofu: ",
      time: "Svartími",
      query: "Sýna fyrirspurn til Hagstofu",
      queryTable: "tafla",
      queryValues: "val",
      updated: "uppfært",
      unit: "eining",
      note: "Athugasemd Hagstofu",
      notice: "Sjálfvirkt valið úr töflu Hagstofu eftir orðum spurningarinnar. Athugaðu valin gildi:",
      otherTables: "Aðrar töflur um efnið",
      more: "Nánar",
      loading: "Sæki gögn frá Hagstofu Íslands…",
      invalid: "Skrifaðu spurningu (að hámarki 500 stafir).",
      offline: "Ekki náðist samband við þjóninn. Reyndu aftur.",
    },
    en: {
      subtitle: "Ask about Icelandic statistics in English or Icelandic. Answers come straight from Statistics Iceland's official data.",
      question: "Question",
      placeholder: "e.g. What is inflation now?",
      send: "Ask",
      examplesLabel: "Example questions",
      examples: [
        "What is inflation now?",
        "How many people live in Iceland?",
        "How has Iceland's population changed?",
        "Inflation in September 2025 and 2026",
        "Inflation excluding housing in March 2026",
        "What was the population increase in 2024?",
        "How many people are unemployed in Iceland?",
        "What is the gender pay gap?",
        "What was inflation in 2024?",
      ],
      openTable: "Open the table at Statistics Iceland: ",
      time: "Response time",
      query: "Show the query sent to Statistics Iceland",
      queryTable: "table",
      queryValues: "values",
      updated: "updated",
      unit: "unit",
      note: "Note from Statistics Iceland",
      notice: "Selected automatically from a Statistics Iceland table, based on the words in your question. Check the selected values:",
      otherTables: "Other tables on this topic",
      more: "Details",
      loading: "Fetching data from Statistics Iceland…",
      invalid: "Please write a question (at most 500 characters).",
      offline: "Could not reach the server. Please try again.",
    },
  };

  const form = document.getElementById("ask");
  const input = document.getElementById("question");
  const log = document.getElementById("log");
  const examples = document.getElementById("examples");
  let lang = "is";

  function t(key) {
    return TEXT[lang][key];
  }

  function setLanguage(next) {
    lang = next === "en" ? "en" : "is";
    try { localStorage.setItem("talnaspor-lang", lang); } catch (error) {}
    document.documentElement.lang = lang;
    document.getElementById("subtitle").textContent = t("subtitle");
    document.getElementById("question-label").textContent = t("question");
    document.getElementById("send").textContent = t("send");
    input.placeholder = t("placeholder");
    examples.setAttribute("aria-label", t("examplesLabel"));
    examples.textContent = "";
    for (const question of t("examples")) {
      const button = element("button", "", question);
      button.type = "button";
      button.addEventListener("click", () => ask(question));
      examples.append(button);
    }
    document.querySelectorAll(".languages button").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
    });
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function details(summary, content) {
    const box = element("details");
    box.append(element("summary", "", summary), element("pre", "", content));
    return box;
  }

  function link(text, url) {
    const anchor = element("a", "", text);
    anchor.href = url;
    anchor.target = "_blank";
    anchor.rel = "noopener";
    return anchor;
  }

  function sourceLink(result) {
    const source = element("p", "meta");
    source.append(t("openTable"), link(result.table_title, result.page_url));
    return source;
  }

  function timing(body) {
    return element("p", "meta", t("time") + ": " + body.elapsed_ms + " ms");
  }

  function query(result) {
    return details(t("query"), JSON.stringify(
      { [t("queryTable")]: result.api_url, [t("queryValues")]: result.selections }, null, 2));
  }

  // Tables without an English version keep their Icelandic title and page.
  function tableTitle(table) {
    return lang === "en" && table.title_en ? table.title_en : table.title;
  }

  function tableUrl(table) {
    return lang === "en" && table.title_en ? table.page_url_en : table.page_url;
  }

  function renderComparison(reply, body) {
    const comparison = body.comparison;
    const change = comparison.difference_text +
      (comparison.relative_change_text ? " (" + comparison.relative_change_text + ")" : "");
    const labels = Object.values(comparison.labels);
    labels.push(comparison.start.period_label + " → " + comparison.end.period_label);

    const points = element("table", "points");
    for (const point of [comparison.start, comparison.end]) {
      const row = element("tr");
      row.append(element("td", "", point.period_label), element("td", "", point.value_text));
      points.append(row);
    }

    reply.append(
      element("div", "figure", change),
      element("div", "labels", labels.join(" · ")),
      points,
      element("p", "sentence", body.message),
      sourceLink(comparison),
      timing(body),
      query(comparison),
    );
  }

  function renderSuggestions(reply, body) {
    const list = element("ol", "tables");
    for (const table of body.tables) {
      const item = element("li");
      const folders = lang === "en" && table.folders_en.length ? table.folders_en : table.folders;
      const updated = table.updated ? " · " + t("updated") + " " + table.updated.slice(0, 10) : "";
      item.append(link(tableTitle(table), tableUrl(table)), element("div", "meta", folders.join(" › ") + updated));
      list.append(item);
    }
    reply.append(element("p", "sentence", body.message), list, timing(body));
  }

  function renderAnswer(reply, body) {
    const answer = body.answer;
    const labels = Object.values(answer.labels).filter((label) => label !== answer.period);
    labels.push(answer.period_label);

    // A catalog table's unit can be long ("Fjöldi/hlutfall"), so it goes on its own line.
    const catalogUnit = answer.kind === "catalog" && answer.unit;
    const figure = catalogUnit
      ? answer.value_text.replace(" (" + answer.unit + ")", "")
      : answer.value_text;
    if (catalogUnit) labels.push(t("unit") + ": " + answer.unit);

    reply.append(
      element("div", "figure", figure),
      element("div", "labels", labels.join(" · ")),
      element("p", "sentence", body.message),
      sourceLink(answer),
      timing(body),
    );
    if (answer.status) {
      reply.append(element("p", "meta", t("note") + ": " + answer.status));
    }
    if (answer.kind === "catalog") {
      const chosen = element("ul", "tables");
      for (const [code, label] of Object.entries(answer.labels)) {
        chosen.append(element("li", "meta", (answer.dimension_labels[code] || code) + ": " + label));
      }
      reply.append(element("p", "notice", t("notice")), chosen);
      if (body.tables && body.tables.length) {
        reply.append(details(t("otherTables"),
          body.tables.map((table) => tableTitle(table) + "\n" + tableUrl(table)).join("\n\n")));
      }
    }
    reply.append(query(answer));
  }

  function render(reply, body) {
    reply.className = "reply " + body.status;
    reply.textContent = "";
    if (body.status === "suggestions") {
      renderSuggestions(reply, body);
      return;
    }
    if (body.status === "answer") {
      if (body.comparison) renderComparison(reply, body);
      else renderAnswer(reply, body);
      return;
    }
    reply.append(element("p", "sentence", body.message));
    if (body.detail) reply.append(details(t("more"), body.detail));
    reply.append(timing(body));
  }

  async function ask(question) {
    const exchange = element("article", "exchange");
    const reply = element("div", "reply loading", t("loading"));
    exchange.append(element("div", "question", question), reply);
    log.prepend(exchange);

    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, lang }),
      });
      const body = await response.json();
      if (response.status === 422) {
        render(reply, { status: "clarification", message: t("invalid"), elapsed_ms: 0 });
      } else {
        render(reply, body);
      }
    } catch (error) {
      reply.className = "reply error";
      reply.textContent = t("offline");
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    ask(question);
  });

  document.querySelectorAll(".languages button").forEach((button) => {
    button.addEventListener("click", () => setLanguage(button.dataset.lang));
  });

  let saved = null;
  try { saved = localStorage.getItem("talnaspor-lang"); } catch (error) {}
  setLanguage(saved || "is");
</script>
</body>
</html>
