<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talnaspor</title>
<style>
  :root {
    --bg: #f4f6f7;
    --surface: #ffffff;
    --text: #13212e;
    --heading: #12324f;
    --muted: #51606e;
    --border: #d8e0e6;
    --accent: #0f6e66;
    --accent-text: #ffffff;
    --user: #e3f1ef;
    --info-bg: #edf4f8;
    --info-border: #bcd3e2;
    --warn-bg: #fbf5e8;
    --warn-border: #e5cd92;
    --error-bg: #fbeeee;
    --error-border: #e2b1b1;
    --code-bg: #eef2f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1620;
      --surface: #142130;
      --text: #e5ecf1;
      --heading: #d6e6f5;
      --muted: #9db0c0;
      --border: #28394a;
      --accent: #4fd1c0;
      --accent-text: #08201d;
      --user: #133331;
      --info-bg: #15283a;
      --info-border: #2c4c68;
      --warn-bg: #2b2414;
      --warn-border: #6a5425;
      --error-bg: #2e1b1d;
      --error-border: #6c3337;
      --code-bg: #0f1a25;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  header h1 { margin: 0; font-size: 1.5rem; color: var(--heading); letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 0.9375rem; }
  .languages { display: flex; gap: 4px; flex-shrink: 0; }
  .languages button {
    padding: 4px 10px;
    font-size: 0.875rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .languages button[aria-pressed="true"] {
    color: var(--accent-text);
    background: var(--accent);
    border-color: var(--accent);
  }
  form {
    display: flex;
    gap: 8px;
    margin: 16px 0 10px;
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 10px;
  }
  form button {
    padding: 12px 18px;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    font-weight: 600;
  }
  /* One scrollable row, so the conversation, not the examples, fills the screen. */
  .examples {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 20px;
    scrollbar-width: thin;
  }
  .examples button {
    flex: 0 0 auto;
    white-space: nowrap;
    padding: 6px 12px;
    font-size: 0.875rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  #log { display: flex; flex-direction: column; gap: 20px; }
  .exchange { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 12px; }
  /* Newest first: a line keeps an earlier exchange from reading as part of the one above. */
  .exchange + .exchange { padding-top: 20px; border-top: 1px solid var(--border); }
  .question {
    align-self: flex-end;
    max-width: 85%;
    padding: 8px 14px;
    background: var(--user);
    border-radius: 14px 14px 4px 14px;
  }
  .reply {
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .reply.clarification, .reply.suggestions {
    background: var(--info-bg);
    border-color: var(--info-border);
  }
  .reply.refusal { background: var(--warn-bg); border-color: var(--warn-border); }
  .reply.error { background: var(--error-bg); border-color: var(--error-border); }
  .reply.loading { color: var(--muted); }
  .figure {
    font-size: 2.5rem;
    font-weight: 700;
    line-height: 1.1;
    color: var(--heading);
    font-variant-numeric: tabular-nums;
  }
  .labels { color: var(--muted); margin: 4px 0 12px; }
  .points { border-collapse: collapse; margin: 0 0 12px; font-variant-numeric: tabular-nums; }
  .points td { padding: 2px 16px 2px 0; }
  .points td:last-child { font-weight: 600; text-align: right; }
  .sentence { margin: 0 0 12px; }
  .meta { font-size: 0.875rem; color: var(--muted); margin: 0; }
  .meta a, .source a, .tables a, dd a { color: var(--accent); }
  .source {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 4px 16px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 0.875rem;
  }
  .source a { font-weight: 600; }
  .tables { margin: 0 0 10px; padding-left: 20px; }
  .tables li { margin-bottom: 8px; }
  .notice {
    margin: 0 0 12px;
    padding: 6px 10px;
    font-size: 0.875rem;
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
  }
  details { margin-top: 10px; font-size: 0.875rem; }
  summary { cursor: pointer; color: var(--muted); }
  dl { margin: 8px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8125rem; }
  pre {
    margin: 8px 0 0;
    padding: 10px;
    overflow-x: auto;
    background: var(--code-bg);
    border-radius: 8px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .retry {
    margin-top: 10px;
    padding: 6px 14px;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    font-weight: 600;
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Talnaspor</h1>
      <p id="subtitle"></p>
    </div>
    <div class="languages" role="group" aria-label="Tungumál / Language">
      <button type="button" data-lang="is">ÍS</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <form id="ask">
    <label id="question-label" for="question" hidden></label>
    <input id="question" type="text" maxlength="500" autocomplete="off" required>
    <button id="send" type="submit"></button>
  </form>

  <div class="examples" id="examples" role="group"></div>

  <section id="log" aria-live="polite"></section>
</main>

<script>
  const TEXT = {
    is: {
      subtitle: "Spurðu um hagtölur á íslensku eða ensku. Svörin koma beint úr opinberum gögnum Hagstofu Íslands.",
      question: "Spurning",
      placeholder: "t.d. Hver er verðbólgan núna?",
      send: "Spyrja",
      examplesLabel: "Dæmi um spurningar",
      examples: [
        "Hver er verðbólgan núna?",
        "Hvað búa margir á Íslandi?",
        "Hvernig hefur mannfjöldinn breyst frá 2015 til 2025?",
        "Verðbólga í september 2025 og 2026",
        "Hver var fjölgun íbúa árið 2024?",
        "Hvernig breyttist atvinnuleysi frá 2020 til 2025?",
        "Hver er munurinn á launum karla og kvenna?",
        "Verðbólga árið 2024",
      ],
      source: "Heimild",
      aboutData: "Nánar um gögnin",
      table: "Tafla",
      queryLabel: "Fyrirspurn til Hagstofu",
      retry: "Reyna aftur",
      time: "Svartími",
      query: "Sýna fyrirspurn til Hagstofu",
      queryTable: "tafla",
      queryValues: "val",
      updated: "uppfært",
      unit: "eining",
      note: "Athugasemd Hagstofu",
      notice: "Sjálfvirkt valið úr töflu Hagstofu eftir orðum spurningarinnar. Athugaðu valin gildi:",
      otherTables: "Aðrar töflur um efnið",
      more: "Nánar",
      loading: "Sæki gögn frá Hagstofu Íslands…",
      invalid: "Skrifaðu spurningu (að hámarki 500 stafir).",
      offline: "Ekki náðist samband við þjóninn. Reyndu aftur.",
      badResponse: "Þjónninn skilaði villu (HTTP {status}). Reyndu aftur.",
      understoodAs: "Skilið sem framhald fyrri spurningar:",
    },
    en: {
      subtitle: "Ask about Icelandic statistics in English or Icelandic. Answers come straight from Statistics Iceland's official data.",
      question: "Question",
      placeholder: "e.g. What is inflation now?",
      send: "Ask",
      examplesLabel: "Example questions",
      examples: [
        "What is inflation now?",
        "How many people live in Iceland?",
        "How has the population changed since 2000?",
        "Inflation in September 2025 and 2026",
        "What was the population increase in 2024?",
        "How did the unemployment rate change between 2020 and 2025?",
        "What is the gender pay gap?",
        "What was inflation in 2024?",
      ],
      source: "Source",
      aboutData: "About the data",
      table: "Table",
      queryLabel: "Query sent to Statistics Iceland",
      retry: "Try again",
      time: "Response time",
      query: "Show the query sent to Statistics Iceland",
      queryTable: "table",
      queryValues: "values",
      updated: "updated",
      unit: "unit",
      note: "Note from Statistics Iceland",
      notice: "Selected automatically from a Statistics Iceland table, based on the words in your question. Check the selected values:",
      otherTables: "Other tables on this topic",
      more: "Details",
      loading: "Fetching data from Statistics Iceland…",
      invalid: "Please write a question (at most 500 characters).",
      offline: "Could not reach the server. Please try again.",
      badResponse: "The server returned an error (HTTP {status}). Please try again.",
      understoodAs: "Understood as a follow-up to the previous question:",
    },
  };

  const form = document.getElementById("ask");
  const input = document.getElementById("question");
  const log = document.getElementById("log");
  const examples = document.getElementById("examples");
  let lang = "is";
  // The last question as the server understood it, which a follow-up such as
  // "What about women?" narrows.
  let lastQuestion = null;

  function t(key) {
    return TEXT[lang][key];
  }

  function setLanguage(next) {
    lang = next === "en" ? "en" : "is";
    try { localStorage.setItem("talnaspor-lang", lang); } catch (error) {}
    document.documentElement.lang = lang;
    document.getElementById("subtitle").textContent = t("subtitle");
    document.getElementById("question-label").textContent = t("question");
    document.getElementById("send").textContent = t("send");
    input.placeholder = t("placeholder");
    examples.setAttribute("aria-label", t("examplesLabel"));
    examples.textContent = "";
    for (const question of t("examples")) {
      const button = element("button", "", question);
      button.type = "button";
      button.addEventListener("click", () => ask(question));
      examples.append(button);
    }
    document.querySelectorAll(".languages button").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
    });
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function details(summary, content) {
    const box = element("details");
    box.append(element("summary", "", summary), element("pre", "", content));
    return box;
  }

  function link(text, url) {
    const anchor = element("a", "", text);
    anchor.href = url;
    anchor.target = "_blank";
    anchor.rel = "noopener";
    return anchor;
  }

  // The server's measured response time; none for a reply the page made itself.
  function timing(body) {
    if (typeof body.elapsed_ms !== "number") return null;
    return t("time") + " " + (body.elapsed_ms < 1 ? "< 1" : body.elapsed_ms) + " ms";
  }

  // The source link and response time, below every answer.
  function footer(result, body) {
    const row = element("div", "source");
    const source = element("span");
    source.append(t("source") + ": ", link(result.table_title, result.page_url));
    row.append(source);
    if (timing(body)) row.append(element("span", "", timing(body)));
    return row;
  }

  // The table, every dimension (label and code) and the exact query, folded away.
  function aboutData(result) {
    const box = element("details");
    const list = element("dl");
    const table = element("dd");
    table.append(link(result.table_title, result.page_url));
    list.append(element("dt", "", t("table")), table);
    for (const [code, values] of Object.entries(result.selections)) {
      const codes = Array.isArray(values) ? values : [values];
      const name = (result.dimension_labels || {})[code] || code;
      const label = (result.labels || {})[code];
      const shown = label && codes.length === 1 ? label + " (" + codes[0] + ")" : codes.join(", ");
      list.append(element("dt", "", name), element("dd", "", shown));
    }
    box.append(
      element("summary", "", t("aboutData")),
      list,
      element("p", "meta", t("queryLabel") + ":"),
      element("pre", "", JSON.stringify(
        { [t("queryTable")]: result.api_url, [t("queryValues")]: result.selections }, null, 2)),
    );
    return box;
  }

  // Tables without an English version keep their Icelandic title and page.
  function tableTitle(table) {
    return lang === "en" && table.title_en ? table.title_en : table.title;
  }

  function tableUrl(table) {
    return lang === "en" && table.title_en ? table.page_url_en : table.page_url;
  }

  function renderComparison(reply, body) {
    const comparison = body.comparison;
    const change = comparison.difference_text +
      (comparison.relative_change_text ? " (" + comparison.relative_change_text + ")" : "");
    const labels = Object.values(comparison.labels);
    labels.push(comparison.start.period_label + " → " + comparison.end.period_label);

    const points = element("table", "points");
    for (const point of [comparison.start, comparison.end]) {
      const row = element("tr");
      row.append(element("td", "", point.period_label), element("td", "", point.value_text));
      points.append(row);
    }

    reply.append(
      element("div", "figure", change),
      element("div", "labels", labels.join(" · ")),
      points,
      element("p", "sentence", body.message),
      footer(comparison, body),
      aboutData(comparison),
    );
  }

  function renderSuggestions(reply, body) {
    const list = element("ol", "tables");
    for (const table of body.tables) {
      const item = element("li");
      const folders = lang === "en" && table.folders_en.length ? table.folders_en : table.folders;
      const updated = table.updated ? " · " + t("updated") + " " + table.updated.slice(0, 10) : "";
      item.append(link(tableTitle(table), tableUrl(table)), element("div", "meta", folders.join(" › ") + updated));
      list.append(item);
    }
    reply.append(element("p", "sentence", body.message), list);
    if (timing(body)) reply.append(element("p", "meta", timing(body)));
  }

  function renderAnswer(reply, body) {
    const answer = body.answer;
    const labels = Object.values(answer.labels).filter((label) => label !== answer.period);
    labels.push(answer.period_label);

    // A catalog table's unit can be long ("Fjöldi/hlutfall"), so it goes on its own line.
    const catalogUnit = answer.kind === "catalog" && answer.unit;
    const figure = catalogUnit
      ? answer.value_text.replace(" (" + answer.unit + ")", "")
      : answer.value_text;
    if (catalogUnit) labels.push(t("unit") + ": " + answer.unit);

    reply.append(
      element("div", "figure", figure),
      element("div", "labels", labels.join(" · ")),
      element("p", "sentence", body.message),
    );
    if (answer.kind === "catalog") {
      reply.append(element("p", "notice", t("notice") + " " + Object.entries(answer.labels)
        .map(([code, label]) => (answer.dimension_labels[code] || code) + ": " + label)
        .join(" · ")));
    }
    if (answer.status) {
      reply.append(element("p", "meta", t("note") + ": " + answer.status));
    }
    reply.append(footer(answer, body), aboutData(answer));
    if (answer.kind === "catalog" && body.tables && body.tables.length) {
      reply.append(details(t("otherTables"),
        body.tables.map((table) => tableTitle(table) + "\n" + tableUrl(table)).join("\n\n")));
    }
  }

  function render(reply, body, question, previous) {
    reply.className = "reply " + body.status;
    reply.removeAttribute("aria-busy");
    reply.textContent = "";
    if (body.understood_as) {
      reply.append(element("p", "meta", t("understoodAs") + " “" + body.understood_as + "”"));
    }
    if (body.status === "suggestions") {
      renderSuggestions(reply, body);
      return;
    }
    if (body.status === "answer") {
      if (body.comparison) renderComparison(reply, body);
      else renderAnswer(reply, body);
      return;
    }
    reply.append(element("p", "sentence", body.message));
    if (body.detail) reply.append(details(t("more"), body.detail));
    if (timing(body)) reply.append(element("p", "meta", timing(body)));
    if (body.status === "error") reply.append(retry(reply, question, previous));
  }

  // Errors (Statistics Iceland unreachable or limiting requests) can be retried in place.
  function retry(reply, question, previous) {
    const button = element("button", "retry", t("retry"));
    button.type = "button";
    button.addEventListener("click", () => ask(question, reply, previous));
    return button;
  }

  async function ask(question, existing, previous = lastQuestion) {
    let reply = existing;
    if (!reply) {
      const exchange = element("article", "exchange");
      reply = element("div");
      exchange.append(element("div", "question", question), reply);
      log.prepend(exchange);
      exchange.scrollIntoView({ block: "start" });
    }
    reply.className = "reply loading";
    reply.setAttribute("aria-busy", "true");
    reply.textContent = t("loading");

    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(previous ? { question, lang, previous } : { question, lang }),
      });
      // A reply that is not JSON (a proxy page, a crash) is a server error, not a lost
      // connection; say which, with its status, so the cause can be found.
      let body;
      try {
        body = await response.json();
      } catch (error) {
        const message = t("badResponse").replace("{status}", response.status);
        render(reply, { status: "error", message }, question, previous);
        return;
      }
      if (response.status === 422) {
        render(reply, { status: "clarification", message: t("invalid") }, question);
      } else {
        // Only an answered question is context for a follow-up, never a clarification
        // or an error.
        if (body.status === "answer" || body.status === "suggestions") {
          lastQuestion = body.understood_as || question;
        }
        render(reply, body, question, previous);
      }
    } catch (error) {
      reply.className = "reply error";
      reply.removeAttribute("aria-busy");
      reply.textContent = t("offline");
      reply.append(retry(reply, question, previous));
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    ask(question);
  });

  document.querySelectorAll(".languages button").forEach((button) => {
    button.addEventListener("click", () => setLanguage(button.dataset.lang));
  });

  let saved = null;
  try { saved = localStorage.getItem("talnaspor-lang"); } catch (error) {}
  setLanguage(saved || "is");
</script>
</body>
</html>
