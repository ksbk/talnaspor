[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talnaspor"
version = "0.1.0"
description = "Auditable statistical question answering using official Icelandic data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "pydantic",
    "pandas",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
